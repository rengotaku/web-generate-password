<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>安全なパスワード生成ツール | password-generator.v41.me</title>
    <meta name="description" content="安全でカスタマイズ可能なパスワードを無料で生成。長さや文字種を選んで、ワンクリックでコピー。">
    <meta name="keywords" content="パスワード生成, 安全なパスワード, ランダムパスワード, パスワードツール">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="toast" id="copyToast">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
        <span>パスワードをコピーしました</span>
    </div>

    <div class="container">
        <h1>パスワード生成ツール</h1>
        <p class="subtitle">安全でカスタマイズ可能なパスワードを即座に生成</p>
        <div class="password-display">
            <input type="text" id="passwordOutput" readonly placeholder="生成されたパスワード">
            <div class="action-buttons">
                <button id="copyBtn" class="copy-btn" title="クリップボードにコピー">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                    </svg>
                </button>
                <button id="regenerateBtn" class="regenerate-btn" title="パスワードを再生成">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"></path>
                        <path d="M21 3v5h-5"></path>
                        <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"></path>
                        <path d="M8 16H3v5"></path>
                    </svg>
                </button>
            </div>
        </div>

        <div class="strength-indicator">
            <span>パスワード強度:</span>
            <div class="strength-bars">
                <div class="bar" id="bar1"></div>
                <div class="bar" id="bar2"></div>
                <div class="bar" id="bar3"></div>
                <div class="bar" id="bar4"></div>
            </div>
            <span id="strengthText">-</span>
        </div>

        <div class="settings">
            <div class="setting">
                <label for="length">パスワードの長さ</label>
                <div class="length-controls">
                    <input type="range" id="length" min="4" max="50" value="12">
                    <input type="number" id="lengthInput" min="4" max="50" value="12">
                </div>
            </div>

            <div class="setting">
                <label>
                    <input type="checkbox" id="uppercase" checked>
                    大文字 (A-Z)
                </label>
            </div>

            <div class="setting">
                <label>
                    <input type="checkbox" id="lowercase" checked>
                    小文字 (a-z)
                </label>
            </div>

            <div class="setting">
                <label>
                    <input type="checkbox" id="numbers" checked>
                    数字 (0-9)
                </label>
            </div>

            <div class="setting">
                <label>
                    <input type="checkbox" id="symbolsSimple">
                    記号（基本） (!@#$)
                </label>
            </div>

            <div class="setting">
                <label>
                    <input type="checkbox" id="symbolsComplex">
                    記号（拡張）
                    <div class="info-icon" id="symbolsComplexInfo">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"></circle>
                            <path d="M12 16v-4"></path>
                            <path d="M12 8h.01"></path>
                        </svg>
                        <div class="tooltip" id="symbolsComplexTooltip">
                            <div class="tooltip-content">
                                !@#$%^&*()-_=+[]{}|;:,.<>?
                            </div>
                        </div>
                    </div>
                </label>
            </div>

            <div class="setting">
                <label>
                    <input type="checkbox" id="excludeSimilar" checked>
                    紛らわしい文字を除外
                    <div class="info-icon" id="excludeSimilarInfo">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"></circle>
                            <path d="M12 16v-4"></path>
                            <path d="M12 8h.01"></path>
                        </svg>
                        <div class="tooltip" id="excludeSimilarTooltip">
                            <div class="tooltip-content">
                                i, l, 1, L, o, 0, O
                            </div>
                        </div>
                    </div>
                </label>
            </div>
        </div>

        <div class="crack-time">
            <div class="crack-time-header">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"></circle>
                    <polyline points="12 6 12 12 16 14"></polyline>
                </svg>
                <span>推定解読時間</span>
            </div>
            <div class="crack-time-columns">
                <div class="crack-time-column">
                    <div class="crack-time-column-header">
                        <span class="column-label">GPU</span>
                        <div class="info-icon" id="gpuInfoIcon">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="12" cy="12" r="10"></circle>
                                <path d="M12 16v-4"></path>
                                <path d="M12 8h.01"></path>
                            </svg>
                            <div class="tooltip" id="gpuTooltip">
                                <div class="tooltip-content">
                                    <div class="spec-item"><strong>攻撃手法:</strong> 総当たり攻撃</div>
                                    <div class="spec-item"><strong>速度:</strong> 毎秒100億回試行</div>
                                    <div class="spec-item"><strong>参考:</strong> RTX 4090 クラス</div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="time-value" id="crackTime">計算中...</div>
                </div>
                <div class="crack-time-divider"></div>
                <div class="crack-time-column">
                    <div class="crack-time-column-header">
                        <span class="column-label">量子</span>
                        <div class="info-icon" id="quantumInfoIcon">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="12" cy="12" r="10"></circle>
                                <path d="M12 16v-4"></path>
                                <path d="M12 8h.01"></path>
                            </svg>
                            <div class="tooltip" id="quantumTooltip">
                                <div class="tooltip-content">
                                    <div class="spec-item"><strong>攻撃手法:</strong> グローバーのアルゴリズム</div>
                                    <div class="spec-item"><strong>効果:</strong> 探索空間を平方根に短縮</div>
                                    <div class="spec-item"><strong>前提:</strong> 理想的な量子コンピュータ</div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="time-value" id="crackTimeQuantum">計算中...</div>
                </div>
            </div>
            <div class="time-details">
                <span>文字種: <strong id="charsetSize">0</strong> 文字</span>
                <span>組み合わせ数: <strong id="combinations">0</strong></span>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
